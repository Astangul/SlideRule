version: '3.8'

services:
  sliderule:
    build: .
    container_name: sliderule-app
    ports:
      - "8501:8501"
    volumes:
      # Monter un volume pour persister/mettre à jour la base sans reconstruire l'image
      - ./Database:/app/Database
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
    restart: unless-stopped
    networks:
      - sliderule-network

networks:
  sliderule-network:
    driver: bridge
